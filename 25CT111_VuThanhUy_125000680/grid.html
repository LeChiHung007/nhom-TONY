<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Apple Glass Widgets</title>
	<link rel="stylesheet" href="grid.css">
</head>
<body>
	<main class="grid-container">
		<article class="card">
			<div class="card-content">
				<div class="card-icon" aria-hidden="true">✦</div>
				<h2>Focus</h2>
				<p>Tập trung vào những điều quan trọng nhất hôm nay.</p>
				<strong>82%</strong>
			</div>
		</article>
		<article class="card">
			<div class="card-content">
				<div class="card-icon" aria-hidden="true">◌</div>
				<h2>Wellness</h2>
				<p>Không gian yên tĩnh để cân bằng năng lượng.</p>
				<strong>7.5h</strong>
			</div>
		</article>
		<article class="card">
			<div class="card-content">
				<div class="card-icon" aria-hidden="true">☼</div>
				<h2>Weather</h2>
				<p>Một ngày trong trẻo với ánh nắng dịu nhẹ.</p>
				<strong>24°</strong>
			</div>
		</article>
	</main>
</body>
</html>
